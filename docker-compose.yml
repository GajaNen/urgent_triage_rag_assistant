services:
  ingest:
    build: .
    command: python ingest_pipeline.py
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./knowledge_base:/app/knowledge_base

  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./knowledge_base:/app/knowledge_base
    depends_on:
      ingest:
        condition: service_completed_successfully

  dashboard:
    build: .
    command: streamlit run dashboard.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - API_URL=http://api:8000
    volumes:
      - ./data:/app/data
    depends_on:
      - api

  eval:
    build: .
    command: python evaluate_llm.py
    profiles: ["tools"]
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./knowledge_base:/app/knowledge_base

  eval-retrieval:
    build: .
    command: sh -c "python retrieval.py && python evaluate_retrieval.py"
    profiles: ["tools"]
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./knowledge_base:/app/knowledge_base
