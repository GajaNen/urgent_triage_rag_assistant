[project]
name = "urgent-triage-assistant"
version = "0.1.0"
description = "RAG-based urgent care triage assistant"
requires-python = ">=3.9"

dependencies = [
    "langchain>=0.0.300",
    "langchain-openai>=0.0.5",
    "langchain-community>=0.0.5",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "pypdf>=3.16.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "biopython>=1.81",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.0.280",
]

